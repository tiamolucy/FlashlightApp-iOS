name: FlashlightApp
options:
  xcodeVersion: "15.4"
  bundleIdPrefix: com.flashlightapp
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  FlashlightApp:
    type: application
    platform: iOS
    sources: FlashlightApp
    info:
      path: FlashlightApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashlightapp.ios
        INFOPLIST_FILE: FlashlightApp/Info.plist
